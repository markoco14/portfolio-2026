<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Mark O'Connor</title>
    <style>

        :root {
            --container-lg: 1200px;

            --bg-blue: #0ca3d2;
            --bg-black: black;

            --btn-gray: #cccccc;
            --btn-gray-hover: #d8d4d4;
            --btn-gray-pressed: #a5a4a4;

            --link-default: #21339c;
            --link-hover: #2f48d8;
            --link-pressed: #16236f;

            --space-sm: 0.25rem;
            --space-md: 0.5rem;
            --space-lg: 1rem;

            --radius-md: 0.5rem;

            --gap-lg: 1rem;
            
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        html {
            overflow-y: scroll;
        }

        a {
            color: var(--link-default);
        }
        a:hover {
            color: var(--link-hover);
        }

        a:active {
            color: var(--link-pressed);
        }

        .header {
            padding-inline: var(--space-lg);
            color: white;
            background-color: var(--bg-blue );
        }

        .header .container {
            height: 3rem;
            max-width: var(--container-lg);
            margin-inline: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header .details {
            display: flex;
            align-items: center;
            gap: var(--gap-lg)
        }

        .msgbox {
            color: white;
            background-color: var(--bg-black);
            padding: var(--space-md);
            border-radius: var(--radius-md);
        }

        .logout-btn {
            display: inline-block;
            text-decoration: none;
            background-color: var(--btn-gray);
            padding: var(--space-md);
            border-radius: var(--radius-md);
        }

        .logout-btn:hover {
            background-color: var(--btn-gray-hover);
        }

        .logout-btn:active {
            background-color: var(--btn-gray-pressed);
        }

        .content .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: var(--container-lg);
            margin-inline: auto;
            padding-block: var(--space-lg);
            border-bottom: 1px solid black;
        }

        .date-selector {
            display: flex;
            gap: var(--gap-lg);
            align-items: center;
        }
        .date-input {
            padding: var(--space-sm);
        }

        .actions .links {
            display: flex;
            gap: var(--gap-lg);
            align-items: center;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <span>A Company CRM 2.1</span>
            <div class="details">
                <span class="msgbox">0</span>
                <span>User: Mark</span>
                <a href="#" class="logout-btn">Logout</a>
            </div>
        </div>
    </header>
    <main class="content">
        <div class="actions">
            <div class="date-selector">
                <span>Mark's Schedule Board</span>
                <form action="/demos/compass/scheduleboard" method="GET">
                    <input type="date" value="{{ date }}" name="date" class="date-input" onchange="this.form.submit()"/>
                </form>
            </div>
            <div class="links">
                <a href="#">Barcode</a>
                <a href="#">QR code</a>
                <a href="#">Weekly</a>
            </div>
        </div>
    </main>
</body>
</html>
