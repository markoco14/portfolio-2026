<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Mark O'Connor</title>
    <script src="/static/vendor/htmx.min.js" defer></script>
    <meta 
        name="htmx-config" 
        content='{
                    "responseHandling":[
                        {"code":"200", "swap": true},
                        {"code":"422", "swap": true}
                    ]
                }'
    />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        section {
            margin-bottom: 2rem;
        }

        ul {
            list-style: inside;
            margin-block: 1rem;
        }

        li {
            margin-bottom: 0.25rem;
        }

        p {
            margin-block: 1rem;
        }

        a {
            color: inherit
        }
        
        .wrapper {
            max-width: 700px;
            margin-inline: auto;
        }

        .header {
            min-height: 3rem;
            border-bottom: 1px solid black;
            margin-bottom: 2rem;
        }

        @media screen and (max-width: 700px) {
            .wrapper {
                padding-inline: 0.5rem;
            }

            .header {
                padding-inline: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
    </header>
    <div class="wrapper">
        {% if not session_user %}
            <section>
                <p id="status"></p>
                <form hx-post="/signin" hx-target="#status" hx-swap="outerHTML">
                    <div>
                        <label for="username">Email</label>
                        <input
                            id="username" 
                            name="username" 
                            type="text" 
                            />
                        <span id="email_error"></span>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input 
                            id="password"
                            name="password" 
                            type="password" 
                            />
                        <span id="password_error"></span>
                    </div>
                    <button type="submit">Sign in</button>
                </form>
            </section>
        {% else %}
            <section>
                <h1>New Run</h1>
                <form hx-post="/fitness">
                    <div>
                        <label for="distance">Distance</label>
                        <input id="distance" type="number" name="distance" step="0.01"/>
                    </div>
                    <div>
                        <label>Activity date</label>
                        <input type="date" name="activity_date" value="{{ today }}">
                    </div>
                    <button type="submit">Save run</button>
                </form>
                <a href="/fitness">Back</a>
            </section>
        {% endif %}
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelector('input[name="activity_date"]').value = new Date().toLocaleDateString('en-CA');
        })
    </script>
</body>
</html>
